name: 'W3CSS Paragraphs'
type: module
description: 'Provides ready-made paragraph types built with the W3.CSS framework, with the Simple and Image types included.'
package: 'W3CSS'
configure: w3css_paragraphs.settings
core_version_requirement: ^11.3 || ^12
php: 8.3
dependencies:
  - drupal:block
  - drupal:field
  - drupal:file
  - drupal:filter
  - drupal:image
  - drupal:link
  - drupal:media
  - drupal:media_library
  - drupal:options
  - drupal:system
  - drupal:text
  - drupal:user
  - drupal:views
  - entity_reference_revisions:entity_reference_revisions
  - paragraphs:paragraphs
  - field_group:field_group
