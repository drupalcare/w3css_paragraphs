shared:
  js:
    js/w3css-paragraphs-shared.js: { }
  dependencies:
    - core/drupal
    - core/once

w3css-paragraphs-settings:
  css:
    theme:
      css/w3css-paragraphs-settings.css: { }

w3css-paragraphs-admin:
  css:
    theme:
      css/w3css-paragraphs-admin.css: { }

w3css-paragraphs-add-dialog:
  css:
    theme:
      css/w3css-paragraphs-add-dialog.css: { }

w3css-paragraphs-swatches:
  css:
    theme:
      css/w3css-color-libraries-classes.css: { }
      css/w3css-paragraphs-swatches.css: { }

w3css-paragraphs-admin-seven:
  deprecated: 'The w3css-paragraphs-admin-seven library is deprecated in w3css_paragraphs:2.0.0 and is removed from w3css_paragraphs:3.0.0. Use w3css-paragraphs-admin and w3css-paragraphs-swatches instead.'
  dependencies:
    - w3css_paragraphs/w3css-paragraphs-admin
    - w3css_paragraphs/w3css-paragraphs-swatches

w3css-paragraphs-admin-claro:
  deprecated: 'The w3css-paragraphs-admin-claro library is deprecated in w3css_paragraphs:2.0.0 and is removed from w3css_paragraphs:3.0.0. Use w3css-paragraphs-admin and w3css-paragraphs-swatches instead.'
  dependencies:
    - w3css_paragraphs/w3css-paragraphs-admin
    - w3css_paragraphs/w3css-paragraphs-swatches

# W3.CSS for themes that do not load it. Attached by W3cssPreprocessHooks only
# when the active theme does not provide it. Copy of the D8W3CSS theme's
# css/w3-css/w3-modern.css; see css/W3CSS-SOURCE.md.
w3css-framework:
  remote: https://www.w3schools.com/w3css/
  version: 4.15-modern
  license:
    name: MIT
    url: https://www.w3schools.com/w3css/w3css_downloads.asp
    gpl-compatible: true
  css:
    base:
      css/w3-modern.css: { weight: -11 }

w3css-paragraphs:
  css:
    theme:
      css/w3css-color-libraries-classes.css: { }
      css/w3css-color-active-classes.css: { }
      css/w3css-paragraphs-base.css: { }
  js:
    js/w3css-paragraphs-base.js: { }
  dependencies:
    - core/drupal
    - core/once
